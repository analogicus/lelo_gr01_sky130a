description: tt_um_lelo_gr01_analogicus tapeout top level
simulations:
   tran:
    name: Oscillator transient
    description: |
      Ramp the supply from zero, power the analog block through
      ui_in<1> with the digital block held in reset, and check that the
      temperature oscillator runs.
    data:
      - name: Lay_typ
        src: results/tran_Lay_typical
        method: typical
   dig:
    name: Digital handshake transient
    description: |
      Full FSM sequence at 32768 Hz with PWRUP_ANA held low, so the
      digital block has to power the oscillator, count it and latch the
      result on its own.
    data:
      - name: Lay_typ
        src: results/dig_Lay_typical
        method: typical
